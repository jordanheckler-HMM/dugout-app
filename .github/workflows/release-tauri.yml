name: Release Tauri App

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to release (example: v0.1.1)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: macOS Apple Silicon
            os: macos-latest
          - platform: macOS Intel
            os: macos-15-intel
          - platform: Windows
            os: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: dugout-lineup-manager-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dugout-lineup-manager-main/package-lock.json

      - name: Resolve release tag
        id: release_tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          APP_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$RELEASE_TAG" != "v$APP_VERSION" ]; then
            echo "Release tag '$RELEASE_TAG' must match Tauri app version v$APP_VERSION."
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ../backend/requirements.txt pyinstaller==6.18.0

      - name: Build backend sidecar
        run: npm run build:sidecar

      - name: Validate signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "❌ Missing TAURI_SIGNING_PRIVATE_KEY secret."
            exit 1
          fi

          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "⚠️ TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty."
            echo "If your key has no password, this is okay. Otherwise set the secret."
          fi

      - name: Build Tauri draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          projectPath: dugout-lineup-manager-main
          tauriScript: npm run tauri
          uploadUpdaterJson: true
          tagName: ${{ steps.release_tag.outputs.tag }}
          releaseName: Dugout ${{ steps.release_tag.outputs.tag }}
          releaseBody: Automated release for Dugout.
          releaseDraft: true
          prerelease: false
