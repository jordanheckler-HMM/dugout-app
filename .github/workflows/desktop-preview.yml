name: Desktop Preview Builds

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} preview
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-latest
            bundle: app
          - platform: macos-x64
            os: macos-15-intel
            bundle: app
          - platform: windows-x64
            os: windows-latest
            bundle: nsis
    defaults:
      run:
        shell: bash
        working-directory: dugout-lineup-manager-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dugout-lineup-manager-main/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ../backend/requirements.txt pyinstaller==6.18.0

      - name: Build backend sidecar
        run: npm run build:sidecar

      - name: Build unsigned desktop preview
        run: npx tauri build --no-sign --bundles ${{ matrix.bundle }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/Dugout.app src-tauri/target/release/bundle/macos/Dugout-${{ matrix.platform }}-preview.zip

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: dugout-${{ matrix.platform }}-preview
          if-no-files-found: error
          path: |
            dugout-lineup-manager-main/src-tauri/target/release/bundle/macos/*-preview.zip
            dugout-lineup-manager-main/src-tauri/target/release/bundle/nsis/*.exe
