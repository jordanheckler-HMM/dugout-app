name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docs:
    name: Docs Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !**/node_modules/**
            !backend/venv/**
            !backend/venv311/**

      - name: Check markdown links
        run: python .github/scripts/check_markdown_links.py

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dugout-lineup-manager-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dugout-lineup-manager-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run frontend tests
        run: npm run test:run

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  smoke:
    name: Browser Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dugout-lineup-manager-main/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend
        working-directory: dugout-lineup-manager-main
        run: npm ci

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Chromium
        working-directory: dugout-lineup-manager-main
        run: npx playwright install --with-deps chromium

      - name: Run the clubhouse smoke test
        working-directory: dugout-lineup-manager-main
        env:
          DUGOUT_DATA_DIR: /tmp/dugout-ci-data
          DUGOUT_BACKEND_PORT: "8100"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8123
        run: |
          mkdir -p "$DUGOUT_DATA_DIR"
          python ../backend/main.py > /tmp/dugout-backend.log 2>&1 &
          npm run build
          npx vite preview --host 127.0.0.1 --port 8123 --strictPort > /tmp/dugout-preview.log 2>&1 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8100/health >/dev/null && curl -sf -o /dev/null http://127.0.0.1:8123/ && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8100/health
          curl -sf -o /dev/null http://127.0.0.1:8123/
          npx playwright test
